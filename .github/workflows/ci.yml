name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Tests
        run: npx vitest run
      - name: Summary
        run: |
          {
            echo "| Stage | Status |"
            echo "| --- | --- |"
            echo "| Typecheck | ✅ |"
            echo "| Build | ✅ |"
            echo "| Tests | ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"